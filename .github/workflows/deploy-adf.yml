name: Deploy Azure Data Factory

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy (Production or UAT)'
        required: true
        type: choice
        options:
          - Production
          - UAT

env:
  RESOURCE_GROUP: ADF-Testing
  FACTORY_NAME: swgdftest20260903
  FACTORY_FOLDER: swgdftest20260903

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout adf_publish branch
        uses: actions/checkout@v4
        with:
          ref: adf_publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Data Factory resources (pipelines, datasets, linked services)
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ${{ env.FACTORY_FOLDER }}/ARMTemplateForFactory.json
          parameters: ${{ env.FACTORY_FOLDER }}/ARMTemplateParametersForFactory.json

      - name: Set Global Parameters for ${{ github.event.inputs.environment }}
        run: |
          az datafactory create \
            --name "${{ env.FACTORY_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --location "$(az datafactory show --name "${{ env.FACTORY_NAME }}" --resource-group "${{ env.RESOURCE_GROUP }}" --query location -o tsv)" \
            --global-parameters '{"StorageAccountName":{"type":"String","value":"${{ vars.STORAGE_ACCOUNT_NAME }}"},"SecretName":{"type":"String","value":"${{ vars.SECRET_NAME }}"}}'
